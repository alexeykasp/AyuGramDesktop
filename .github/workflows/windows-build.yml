name: Windows x64 Build (Qt6)

on:
  push:
    branches: [sync-7.2.8]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install C++ ATL (breakpad dependency)
        shell: powershell
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vsWhere -latest -property installationPath
          $installerPath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          Start-Process -FilePath $installerPath -ArgumentList "modify","--installPath","`"$installPath`"","--add","Microsoft.VisualStudio.Component.VC.ATL","--quiet","--wait" -Wait -NoNewWindow
          Write-Host "ATL component installed"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ninja
        run: choco install -y ninja

      - name: Download Qt6 + build dependencies
        shell: cmd
        run: |
          cd Telegram\build\prepare
          python prepare.py qt6
        env:
          Platform: x64
          COMSPEC: C:\Windows\System32\cmd.exe

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DQT6=ON
        env:
          Platform: x64

      - name: Build AyuGram
        shell: cmd
        run: |
          cmake --build build --config Release -- -m:2
        env:
          CL_MPCount: 2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-windows-x64
          path: build/Telegram/Release/*.exe
          if-no-files-found: error
